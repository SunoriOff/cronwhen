[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronwhen"
version = "0.1.0"
description = "Explain cron expressions in plain English and list the next runs. Offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "WTFPL" }
authors = [{ name = "SunoriOff" }]
keywords = ["cron", "crontab", "scheduler", "cli", "devtools", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cronwhen = "cronwhen.cli:main"

[project.urls]
Homepage = "https://github.com/SunoriOff/cronwhen"
Issues = "https://github.com/SunoriOff/cronwhen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
